name: Validate editor
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run test:browser:prepare
      - run: npm run test:gate
      - run: npm run build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: automated-test-evidence
          path: |
            test-results/
            coverage/
