name: Validate editor
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Verify vendored UI/UX Pro Max skill
        run: node scripts/verify-vendored-ui-skill.mjs
      - run: npm ci
      - run: npm run test:browser:prepare
      - run: npx playwright install --with-deps firefox webkit
      - run: npm run test:gate
      - run: npm run build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: automated-test-evidence
          path: |
            test-results/
            coverage/
