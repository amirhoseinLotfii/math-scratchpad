<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc" direction="ltr"><title id="title">Start fresh. Pick up your work.</title><desc id="desc">Exercise management and a text-based JSON backup workflow; storage depends on the host.</desc>
<defs><radialGradient id="bg" cx="0" cy="0" r="1"><stop stop-color="#244d3b"/><stop offset="1" stop-color="#101916"/></radialGradient></defs>
<rect width="1600" height="1000" fill="url(#bg)"/>
<g font-family="DejaVu Sans,Arial,sans-serif">
<text x="64" y="64" fill="#d0f5e2" font-size="27" font-weight="500" text-anchor="start">Math Scratchpad</text>
<text x="64" y="142" fill="#f2f6f3" font-size="52" font-weight="600" text-anchor="start">Start fresh. Pick up your work.</text>
<text x="64" y="194" fill="#b8c5bf" font-size="28" font-weight="400" text-anchor="start">Math / LaTeX input, Persian problem text and portable session backups.</text>
<rect x="64" y="265" width="470" height="650" rx="24" fill="#202624" stroke="#424d47" stroke-width="2"/>
<rect x="565" y="265" width="470" height="650" rx="24" fill="#202624" stroke="#424d47" stroke-width="2"/>
<rect x="1066" y="265" width="470" height="650" rx="24" fill="#202624" stroke="#424d47" stroke-width="2"/>
<text x="100" y="335" fill="#d0f5e2" font-size="32" font-weight="600" text-anchor="start">Enter a problem</text>
<rect x="95" y="385" width="408" height="64" rx="16" fill="#254c3d" stroke="#d0f5e2" stroke-width="2"/>
<text x="299.0" y="427.0" fill="#d0f5e2" font-size="28" font-weight="500" text-anchor="middle">Math / LaTeX</text>
<rect x="95" y="465" width="408" height="64" rx="16" fill="#2b302f" stroke="#424d47" stroke-width="2"/>
<text x="299.0" y="507.0" fill="#f2f6f3" font-size="28" font-weight="500" text-anchor="middle">Persian text</text>
<rect x="95" y="565" width="408" height="150" rx="24" fill="#252b28" stroke="#424d47" stroke-width="2"/>
<text x="120" y="625" fill="#f2f6f3" font-size="30" font-weight="400" text-anchor="start">\frac{2}{3}</text>
<text x="120" y="675" fill="#f2f6f3" font-size="30" font-weight="400" text-anchor="start">+ \frac{1}{4}</text>
<rect x="95" y="785" width="408" height="64" rx="16" fill="#254c3d" stroke="#d0f5e2" stroke-width="2"/>
<text x="299.0" y="827.0" fill="#d0f5e2" font-size="28" font-weight="500" text-anchor="middle">Start</text>
<text x="600" y="335" fill="#d0f5e2" font-size="32" font-weight="600" text-anchor="start">Switch exercises</text>
<rect x="595" y="385" width="408" height="64" rx="16" fill="#254c3d" stroke="#d0f5e2" stroke-width="2"/>
<text x="799.0" y="427.0" fill="#d0f5e2" font-size="28" font-weight="500" text-anchor="middle">Exercise 1</text>
<text x="625" y="500" fill="#b8c5bf" font-size="28" font-weight="400" text-anchor="start">In progress</text>
<rect x="595" y="555" width="408" height="64" rx="16" fill="#2b302f" stroke="#424d47" stroke-width="2"/>
<text x="799.0" y="597.0" fill="#f2f6f3" font-size="28" font-weight="500" text-anchor="middle">Exercise 2</text>
<text x="625" y="670" fill="#b8c5bf" font-size="28" font-weight="400" text-anchor="start">Final marked</text>
<text x="600" y="820" fill="#b8c5bf" font-size="26" font-weight="400" text-anchor="start">Resume a saved draft.</text>
<text x="1100" y="335" fill="#d0f5e2" font-size="32" font-weight="600" text-anchor="start">Session backup</text>
<rect x="1096" y="385" width="408" height="64" rx="16" fill="#254c3d" stroke="#d0f5e2" stroke-width="2"/>
<text x="1300.0" y="427.0" fill="#d0f5e2" font-size="28" font-weight="500" text-anchor="middle">Copy session</text>
<rect x="1096" y="465" width="408" height="64" rx="16" fill="#2b302f" stroke="#424d47" stroke-width="2"/>
<text x="1300.0" y="507.0" fill="#f2f6f3" font-size="28" font-weight="500" text-anchor="middle">Restore</text>
<text x="1100" y="615" fill="#b8c5bf" font-size="27" font-weight="400" text-anchor="start">Copy session text.</text>
<text x="1100" y="655" fill="#b8c5bf" font-size="27" font-weight="400" text-anchor="start">Save it externally.</text>
<text x="1100" y="695" fill="#b8c5bf" font-size="27" font-weight="400" text-anchor="start">Paste it to restore.</text>
<text x="1100" y="795" fill="#b8c5bf" font-size="24" font-weight="400" text-anchor="start">Draft recovery depends</text>
<text x="1100" y="835" fill="#b8c5bf" font-size="24" font-weight="400" text-anchor="start">on local storage.</text>
</g></svg>
