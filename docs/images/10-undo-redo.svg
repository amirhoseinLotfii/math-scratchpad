<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc" direction="ltr"><title id="title">Try an edit. Keep a way back.</title><desc id="desc">Inserting 9 into 123 gives 1923; Undo restores 123 and Redo returns to 1923.</desc>
<defs><radialGradient id="bg" cx="0" cy="0" r="1"><stop stop-color="#244d3b"/><stop offset="1" stop-color="#101916"/></radialGradient></defs>
<rect width="1600" height="1000" fill="url(#bg)"/>
<g font-family="DejaVu Sans,Arial,sans-serif">
<text x="64" y="64" fill="#d0f5e2" font-size="27" font-weight="500" text-anchor="start">Math Scratchpad</text>
<text x="64" y="142" fill="#f2f6f3" font-size="52" font-weight="600" text-anchor="start">Try an edit. Keep a way back.</text>
<text x="64" y="194" fill="#b8c5bf" font-size="28" font-weight="400" text-anchor="start">Undo and Redo restore document history, including structured math.</text>
<rect x="64" y="285" width="470" height="390" rx="24" fill="#202624" stroke="#424d47" stroke-width="2"/>
<text x="99" y="355" fill="#d0f5e2" font-size="29" font-weight="500" text-anchor="start">Before</text>
<text x="299" y="535" fill="#f2f6f3" font-size="90" font-weight="400" text-anchor="middle">123</text>
<rect x="565" y="285" width="470" height="390" rx="24" fill="#202624" stroke="#424d47" stroke-width="2"/>
<text x="600" y="355" fill="#d0f5e2" font-size="29" font-weight="500" text-anchor="start">After inserting 9</text>
<text x="800" y="535" fill="#f2f6f3" font-size="90" font-weight="400" text-anchor="middle">1923</text>
<rect x="1066" y="285" width="470" height="390" rx="24" fill="#202624" stroke="#424d47" stroke-width="2"/>
<text x="1101" y="355" fill="#d0f5e2" font-size="29" font-weight="500" text-anchor="start">After Undo</text>
<text x="1301" y="535" fill="#f2f6f3" font-size="90" font-weight="400" text-anchor="middle">123</text>
<text x="548" y="510" fill="#d0f5e2" font-size="38" font-weight="400" text-anchor="middle">→</text>
<text x="1049" y="510" fill="#d0f5e2" font-size="38" font-weight="400" text-anchor="middle">→</text>
<rect x="210" y="750" width="475" height="64" rx="16" fill="#2b302f" stroke="#424d47" stroke-width="2"/>
<text x="447.5" y="792.0" fill="#f2f6f3" font-size="28" font-weight="500" text-anchor="middle">Undo</text>
<rect x="915" y="750" width="475" height="64" rx="16" fill="#254c3d" stroke="#d0f5e2" stroke-width="2"/>
<text x="1152.5" y="792.0" fill="#d0f5e2" font-size="28" font-weight="500" text-anchor="middle">Redo</text>
<text x="800" y="900" fill="#b8c5bf" font-size="30" font-weight="400" text-anchor="middle">Undo restores the prior edit. Redo reapplies it.</text>
</g></svg>
