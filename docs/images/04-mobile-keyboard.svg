<text x="634.0" y="485.0" fill="#f2f6f3" font-size="28" font-weight="500" text-anchor="middle">3</text>
<rect x="752" y="438" width="204" height="74" rx="16" fill="#254c3d" stroke="#d0f5e2" stroke-width="2"/>
<text x="854.0" y="485.0" fill="#d0f5e2" font-size="28" font-weight="500" text-anchor="middle">÷</text>
