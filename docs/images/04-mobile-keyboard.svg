<text x="194.0" y="573.0" fill="#f2f6f3" font-size="28" font-weight="500" text-anchor="middle">4</text>
<rect x="312" y="526" width="204" height="74" rx="16" fill="#2b302f" stroke="#424d47" stroke-width="2"/>
<text x="414.0" y="573.0" fill="#f2f6f3" font-size="28" font-weight="500" text-anchor="middle">5</text>
<rect x="532" y="526" width="204" height="74" rx="16" fill="#2b302f" stroke="#424d47" stroke-width="2"/>
<text x="634.0" y="573.0" fill="#f2f6f3" font-size="28" font-weight="500" text-anchor="middle">6</text>
<rect x="752" y="526" width="204" height="74" rx="16" fill="#254c3d" stroke="#d0f5e2" stroke-width="2"/>
<text x="854.0" y="573.0" fill="#d0f5e2" font-size="28" font-weight="500" text-anchor="middle">×</text>
<rect x="92" y="614" width="204" height="74" rx="16" fill="#2b302f" stroke="#424d47" stroke-width="2"/>
<text x="194.0" y="661.0" fill="#f2f6f3" font-size="28" font-weight="500" text-anchor="middle">7</text>
<rect x="312" y="614" width="204" height="74" rx="16" fill="#2b302f" stroke="#424d47" stroke-width="2"/>
<text x="414.0" y="661.0" fill="#f2f6f3" font-size="28" font-weight="500" text-anchor="middle">8</text>
<rect x="532" y="614" width="204" height="74" rx="16" fill="#2b302f" stroke="#424d47" stroke-width="2"/>
<text x="634.0" y="661.0" fill="#f2f6f3" font-size="28" font-weight="500" text-anchor="middle">9</text>
<rect x="752" y="614" width="204" height="74" rx="16" fill="#254c3d" stroke="#d0f5e2" stroke-width="2"/>
<text x="854.0" y="661.0" fill="#d0f5e2" font-size="28" font-weight="500" text-anchor="middle">−</text>
<rect x="92" y="702" width="204" height="74" rx="16" fill="#2b302f" stroke="#424d47" stroke-width="2"/>
<text x="194.0" y="749.0" fill="#f2f6f3" font-size="28" font-weight="500" text-anchor="middle">0</text>
<rect x="312" y="702" width="204" height="74" rx="16" fill="#2b302f" stroke="#424d47" stroke-width="2"/>
<text x="414.0" y="749.0" fill="#f2f6f3" font-size="28" font-weight="500" text-anchor="middle">.</text>
<rect x="532" y="702" width="204" height="74" rx="16" fill="#2b302f" stroke="#424d47" stroke-width="2"/>
<text x="634.0" y="749.0" fill="#f2f6f3" font-size="28" font-weight="500" text-anchor="middle">=</text>
<rect x="752" y="702" width="204" height="74" rx="16" fill="#254c3d" stroke="#d0f5e2" stroke-width="2"/>
<text x="854.0" y="749.0" fill="#d0f5e2" font-size="28" font-weight="500" text-anchor="middle">+</text>
<rect x="92" y="800" width="278" height="58" rx="16" fill="#2b302f" stroke="#424d47" stroke-width="2"/>
<text x="231.0" y="839.0" fill="#f2f6f3" font-size="28" font-weight="500" text-anchor="middle">←</text>
<rect x="386" y="800" width="278" height="58" rx="16" fill="#2b302f" stroke="#424d47" stroke-width="2"/>
<text x="525.0" y="839.0" fill="#f2f6f3" font-size="28" font-weight="500" text-anchor="middle">→</text>
<rect x="680" y="800" width="278" height="58" rx="16" fill="#2b302f" stroke="#424d47" stroke-width="2"/>
<text x="819.0" y="839.0" fill="#f2f6f3" font-size="28" font-weight="500" text-anchor="middle">Next</text>
<text x="1040" y="365" fill="#d0f5e2" font-size="42" font-weight="600" text-anchor="start">1 → 2 → 3</text>
<text x="1040" y="445" fill="#b8c5bf" font-size="27" font-weight="400" text-anchor="start">Numbers increase</text>
<text x="1040" y="485" fill="#b8c5bf" font-size="27" font-weight="400" text-anchor="start">from the upper left.</text>
<text x="1040" y="600" fill="#d0f5e2" font-size="72" font-weight="400" text-anchor="start">⌫</text>
<text x="1040" y="670" fill="#b8c5bf" font-size="27" font-weight="400" text-anchor="start">Delete without reaching</text>
<text x="1040" y="710" fill="#b8c5bf" font-size="27" font-weight="400" text-anchor="start">below the number grid.</text>
</g></svg>
